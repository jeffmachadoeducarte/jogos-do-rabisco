# Site estático dos Jogos do Rabisco (app "jogos" no EasyPanel)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # login e senha para o site todo (arquivo fora da pasta pública)
  auth_basic "Jogos do Rabisco - Educarte";
  auth_basic_user_file /etc/nginx/.htpasswd;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # arquivos ocultos nunca são entregues
  location ~ /\. { deny all; }

  # sem senha: o aparelho precisa baixar o service worker novo que apaga a cópia antiga
  location = /sw.js { auth_basic off; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # páginas e código: o tablet sempre confere se tem versão nova
  location ~* \.(html|js|css|json)$ { add_header Cache-Control "no-cache"; }
  # vozes, imagens e fontes quase não mudam
  location ~* \.(mp3|png|jpg|svg|otf|woff2?)$ { expires 30d; add_header Cache-Control "public"; }

  location / { try_files $uri $uri/ =404; }
}
