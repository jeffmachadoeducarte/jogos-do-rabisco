# Site estático dos Jogos do Rabisco (app "jogos" no EasyPanel)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # arquivos ocultos nunca são entregues
  location ~ /\. { deny all; }

  # o aparelho sempre confere se há service worker novo
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # páginas e código: o tablet sempre confere se tem versão nova
  location ~* \.(html|js|css|json)$ { add_header Cache-Control "no-cache"; }
  # vozes, imagens e fontes quase não mudam
  # vozes, músicas e imagens: o aparelho sempre confere se mudou (resposta 304 rápida, sem baixar de novo);
  # assim uma fala regravada ou uma foto nova aparece na hora
  location ~* \.(mp3|png|jpg|jpeg|webp|svg)$ { add_header Cache-Control "no-cache"; }
  # fontes quase não mudam
  location ~* \.(otf|woff2?)$ { expires 30d; add_header Cache-Control "public"; }

  location / { try_files $uri $uri/ =404; }
}
