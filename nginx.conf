# Site estático dos Jogos do Rabisco (app "jogos" no EasyPanel)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # páginas e código: o tablet sempre confere se tem versão nova
  location ~* \.(html|js|css|json)$ { add_header Cache-Control "no-cache"; }
  # vozes, imagens e fontes quase não mudam
  location ~* \.(mp3|png|jpg|svg|otf|woff2?)$ { expires 30d; add_header Cache-Control "public"; }

  location / { try_files $uri $uri/ =404; }
}
