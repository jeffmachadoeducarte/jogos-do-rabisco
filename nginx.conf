# Site estático dos Jogos do Rabisco (app "jogos" no EasyPanel)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeçalhos de segurança. ATENÇÃO: no nginx, um add_header dentro de um location anula os do server;
  # por isso o mesmo bloco é repetido em cada location que tem add_header. Mudou aqui? Mude em todos.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # arquivos ocultos e de desenvolvimento nunca são entregues (404, não 403: não confirma que existem)
  location ~ /\. { return 404; }
  location ^~ /.git { return 404; }
  location ^~ /.claude { return 404; }
  location ^~ /servidor { return 404; }
  location ^~ /ferramentas { return 404; }
  location ^~ /referencias { return 404; }
  location ^~ /node_modules { return 404; }
  location = /Dockerfile { return 404; }
  location = /nginx.conf { return 404; }
  location = /README.md { return 404; }
  location = /src/radio/teste.html { return 404; }
  location ~* ^/package[^/]*\.json$ { return 404; }
  location ~* \.py$ { return 404; }
  # scripts de geração/teste em node (nada do jogo usa .mjs, exceto o que ficar em /vendor/)
  location ~* ^/(?!vendor/).*\.mjs$ { return 404; }

  # o aparelho sempre confere se há service worker novo
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  # o primeiro nome da criança vai no caminho do MP3: não registrar no log de acesso (privacidade)
  location ^~ /assets/voz/nomes/ {
    access_log off;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  # páginas e código: o tablet sempre confere se tem versão nova
  location ~* \.(html|js|css|json)$ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
  # vozes, músicas e imagens: o aparelho sempre confere se mudou (resposta 304 rápida, sem baixar de novo);
  # assim uma fala regravada ou uma foto nova aparece na hora
  location ~* \.(mp3|png|jpg|jpeg|webp|svg)$ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }
  # fontes quase não mudam
  location ~* \.(otf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), gamepad=(self), fullscreen=(self), screen-wake-lock=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: wss://sala.educarte.qzz.io https://nominatim.openstreetmap.org https://n8n.educarte.qzz.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }

  location / { try_files $uri $uri/ =404; }
}
