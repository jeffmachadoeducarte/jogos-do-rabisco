<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#00b5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rabisco">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jogos do Rabisco</title>
  <meta name="description" content="Jogos pedagógicos do Rabisco, mascote da Educarte Escola Cristã.">
  <link rel="icon" href="assets/marca/logos/icone-rosa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- foto da cena (pré-renderizada) aparece na hora; a cena 3D viva entra por cima depois -->
  <link rel="preload" as="image" href="assets/portal-entrada-paisagem.webp" media="(orientation: landscape)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/portal-entrada-retrato.webp" media="(orientation: portrait)" fetchpriority="high">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/motor/familia.css">
</head>
<body>
  <canvas id="cena" aria-hidden="true"></canvas>
  <div class="veu" aria-hidden="true"></div>

  <header class="topo">
    <img class="logo" src="assets/marca/logos/azul-icone-rosa.png" alt="Educarte Escola Cristã">
    <button class="familia-botao-portal" id="familia" aria-label="Cadastrar a família"><span class="roda">🧒</span><span>Família</span></button>
    <button class="instalar" id="instalar" hidden aria-label="Instalar o app">📲 Instalar</button>
    <label class="filtro-ingles">
      <input type="checkbox" id="so-ingles">
      <span>🇺🇸 Só inglês</span>
    </label>
  </header>

  <section class="boas-vindas" id="boas-vindas">
    <h1>Jogos do <span>Rabisco</span></h1>
    <p>Escolha a sua idade e vamos brincar!</p>
  </section>

  <nav class="faixas" id="faixas" aria-label="Escolha a idade"></nav>

  <aside class="painel-jogos" id="painel" hidden>
    <div class="painel-topo">
      <div>
        <h2 id="painel-titulo"></h2>
        <p><span id="painel-idade"></span> <span class="painel-contagem" id="painel-contagem"></span></p>
      </div>
      <button class="fechar" id="fechar" aria-label="Voltar para as idades">✕</button>
    </div>
    <p class="nota" id="painel-nota" hidden></p>
    <div class="jogos" id="jogos"></div>
  </aside>

  <button id="som" class="som" aria-label="Configurações: som e jogar na TV">⚙️</button>

  <script type="module" src="src/app.js"></script>
</body>
</html>
