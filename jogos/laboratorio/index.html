<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório do Rabisco</title>
  <style>
    html, body { margin: 0; height: 100%; background: #bfeaff; overflow: hidden; }
    #jogo { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="jogo"></div>
  <script src="../../vendor/phaser.min.js"></script>
  <script type="module">
    import { carregarRabisco, Rabisco } from "../../src/motor/rabisco.js";

    const CHAO = 600;

    class Lab extends Phaser.Scene {
      preload() { carregarRabisco(this, "../.."); }

      create() {
        const g = this.add.graphics();
        g.fillGradientStyle(0x6fd3ff, 0x6fd3ff, 0xd9f4ff, 0xd9f4ff, 1).fillRect(0, 0, 1280, CHAO);
        g.fillStyle(0x58c43a).fillRect(0, CHAO, 1280, 24);
        g.fillStyle(0x9a6232).fillRect(0, CHAO + 24, 1280, 200);
        this.add.text(640, 60, "Setas para andar · Espaço para pular · (sem tocar: demonstração automática)", {
          fontFamily: "system-ui", fontSize: "22px", color: "#1b1f3b",
        }).setOrigin(0.5);

        this.rabisco = new Rabisco(this, 640, CHAO, 230);
        this.vx = 0; this.vy = 0; this.y = CHAO;
        this.teclas = this.input.keyboard.createCursorKeys();
        this.auto = true;
        this.input.keyboard.on("keydown", () => (this.auto = false));
      }

      update(_, dms) {
        const dt = Math.min(dms / 1000, 0.05);
        const t = this.time.now / 1000;
        let quer = 0, pula = false;
        if (this.auto) {
          // ciclo: anda, corre, para, pula, volta
          const c = t % 12;
          quer = c < 3 ? 0.45 : c < 5.5 ? 1 : c < 7 ? 0 : c < 10 ? -1 : 0;
          pula = (c > 4.2 && c < 4.25) || (c > 7.5 && c < 7.55) || (c > 8.8 && c < 8.85);
        } else {
          quer = (this.teclas.right.isDown ? 1 : 0) - (this.teclas.left.isDown ? 1 : 0);
          pula = Phaser.Input.Keyboard.JustDown(this.teclas.space) || Phaser.Input.Keyboard.JustDown(this.teclas.up);
        }
        const noChao = this.y >= CHAO;
        this.vx = Phaser.Math.Linear(this.vx, quer * 320, Math.min(1, dt * (quer ? 6 : 9)));
        if (pula && noChao) this.vy = -780;
        this.vy += 2000 * dt;
        this.y = Math.min(CHAO, this.y + this.vy * dt);
        if (this.y >= CHAO) this.vy = Math.max(0, this.vy) && 0;
        const r = this.rabisco;
        r.x += this.vx * dt;
        if (r.x > 1200) r.x = 80; if (r.x < 80) r.x = 1200;
        r.y = this.y;
        r.atualizar(dt, { vx: this.vx, vy: noChao ? 0 : this.vy, noChao: this.y >= CHAO });
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO, parent: "jogo", backgroundColor: "#bfeaff",
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 1280, height: 720 },
      scene: Lab,
    });
  </script>
</body>
</html>
